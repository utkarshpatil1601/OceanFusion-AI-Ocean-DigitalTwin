services:
  - type: web
    name: oceanfusion-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: waitress-serve --call --listen=0.0.0.0:$PORT backend.app:create_app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: oceanfusion-db-oregon
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: oceanfusion-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: oceanfusion-db-oregon
    plan: free
    region: oregon
    postgresMajorVersion: "16"
